:root{
  --bg:#f5edda;
  --surface:#fffaf0;
  --surface-2:#e9f1df;
  --ink:#25351f;
  --muted:#66705e;
  --primary:#38724e;
  --primary-dark:#265638;
  --accent:#d99b39;
  --line:#d8cdb4;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d2a1f;
    --surface: #273829;
    --surface-2:#33482f;
    --ink:#f2ecdc;
    --muted:#c9cdbd;
    --line:#55634f;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px;
  line-height:1.5
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(circle at 88% 8%, rgba(217,155,57,.16), transparent 28%), var(--bg);
  overflow-x:clip
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:10;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 22px rgba(37,53,31,.06)
}

.utility-bar{
  max-width:1180px;
  margin:auto;
  padding:7px 20px 0;
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:4px 16px;
  color:var(--muted);
  font-size:.72rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase
}

.topbar-inner{
  max-width:1180px;
  margin:auto;
  padding:10px 20px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:var(--ink);
  min-width:0
}

.brand strong,.brand small{
  display:block
}

.brand strong{
  font-family:Georgia,serif;
  font-size:1.28rem;
  line-height:1.05;
  letter-spacing:-.01em
}

.brand small{
  color:var(--muted);
  font-weight:700;
  font-size:.78rem;
  line-height:1.3;
  max-width:430px
}

.brand-mark{
  width:46px;
  height:46px;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.06em;
  border:1px solid var(--primary-dark)
}

.header-nav{
  display:flex;
  gap:22px
}

.header-nav a{
  color:var(--ink);
  text-decoration:none;
  font-weight:800;
  font-size:.92rem;
  padding:6px 0;
  border-bottom:2px solid transparent
}

.header-nav a:hover{
  color:var(--primary);
  border-bottom-color:var(--primary)
}

.header-actions{
  display:flex;
  align-items:center;
  gap:16px;
  flex:0 0 auto
}

.credential{
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--primary);
  font-weight:800;
  font-size:.8rem;
  white-space:nowrap
}

.header-cta{
  background:var(--primary);
  color:#fff;
  text-decoration:none;
  font-weight:900;
  font-size:.9rem;
  padding:11px 16px;
  border-radius:999px;
  white-space:nowrap
}

.header-cta:hover{
  background:var(--primary-dark)
}

.top-tag{
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--primary);
  font-weight:800;
  font-size:.86rem
}

.principles{
  list-style:none;
  padding:0;
  margin:22px 0 0;
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.principles li{
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 11px;
  font-size:.86rem;
  font-weight:800;
  color:var(--ink)
}

.interest-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.interest{
  display:flex;
  align-items:center;
  gap:10px;
  border:2px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:14px;
  padding:13px 12px;
  font-weight:800;
  cursor:pointer;
  min-height:54px
}

.interest.on{
  border-color:var(--primary);
  background:var(--surface-2)
}

.interest input{
  position:absolute;
  opacity:0;
  pointer-events:none
}

.interest-check{
  width:22px;
  height:22px;
  border:2px solid var(--line);
  border-radius:6px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  background:#fff;
  color:var(--primary);
  font-size:.85rem
}

.interest.on .interest-check{
  border-color:var(--primary);
  background:var(--primary);
  color:#fff
}

.result-interests{
  font-size:.92rem;
  line-height:1.5;
  margin:14px 0 0
}

@media screen and (max-width: 820px){
  .header-nav,.credential{
    display:none
  }

  .utility-bar span:last-child{
    display:none
  }

  .topbar-inner{
    padding:10px 16px 12px
  }

  .brand strong{
    font-size:1.12rem
  }

  .header-cta{
    padding:10px 13px;
    font-size:.84rem
  }

  .utility-bar{
    padding-left:16px;
    padding-right:16px
  }
}

@media screen and (max-width: 560px){
  .interest-grid{
    grid-template-columns:1fr
  }

  .principles li{
    font-size:.82rem
  }

  .utility-bar{
    font-size:.64rem
  }
}

main {
  max-width: 780px;
  margin: auto;
  padding: 0 18px 40px;
}

.hero {
  display: grid;
  grid-template-columns: 1fr;
  gap: 22px;
  align-items: start;
  padding: 36px 0 28px;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.78rem;
  font-weight: 900;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0 0 14px;
}

.hero h1 {
  font-family: Georgia, serif;
  font-size: clamp(2.9rem, 11vw, 4.6rem);
  line-height: 0.9;
  letter-spacing: -0.055em;
  margin: 0;
}

.hero h1 em {
  color: var(--primary);
  font-weight: 600;
}

.subtitle {
  font-size: clamp(1.08rem, 2vw, 1.35rem);
  line-height: 1.5;
  max-width: 640px;
  margin: 22px 0;
}

.hero-notes {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  color: var(--muted);
  font-weight: 800;
}

.hero-notes span {
  display: flex;
  align-items: center;
  gap: 7px;
}

.hero-card {
  background: var(--primary);
  color: #fff;
  border-radius: 28px;
  padding: 26px;
  box-shadow: 0 20px 45px rgba(38, 86, 56, 0.22);
}

.hero-card-top {
  display: flex;
  gap: 8px;
  align-items: center;
  font-weight: 800;
  opacity: 0.96;
  margin: 0 0 10px;
  font-size: 1.05rem;
}

.step-mini{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#fff;
  color:var(--primary);
  display:grid;
  place-items:center;
  flex:0 0 auto;
  font-weight:900
}

.hero-card-note{
  opacity:.88;
  line-height:1.5;
  margin:16px 0 4px
}

.hero-big {
  font-family: Georgia, serif;
  font-size: clamp(2.25rem, 4vw, 3.3rem);
  line-height: 1;
  margin: 18px 0 8px;
}

.hero-card p {
  margin: 6px 0;
}

.hero-card .muted {
  color: #d7e6d6;
}

.small {
  font-size: 0.9rem;
}

.muted {
  color: var(--muted);
}

.text-btn {
  border: 0;
  background: transparent;
  color: #fff;
  font-weight: 900;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 0 0;
}

.calculator {
  padding: 20px 0;
}

.section-head {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: end;
  margin-bottom: 24px;
}

.section-head h2 {
  font-family: Georgia, serif;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  line-height: 1.05;
  margin: 0;
}

.section-intro {
  max-width: 360px;
  color: var(--muted);
  line-height: 1.5;
  margin: 0;
}

.calc-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 22px;
  align-items: start;
}

.left-col h3 {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.15rem;
  margin: 0 0 14px;
}

.step {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 0.9rem;
  flex: 0 0 auto;
}

.services {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 30px;
}

.service-card {
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 18px;
  padding: 18px;
  text-align: left;
  display: flex;
  gap: 12px;
  align-items: center;
  min-width: 0;
  min-height: 88px;
}

.service-card.active {
  border-color: var(--primary);
  background: var(--surface-2);
  box-shadow: 0 8px 22px rgba(38, 86, 56, 0.12);
}

.service-icon {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--primary);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  font-size: 1.8rem;
}

.service-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.service-text strong {
  font-size: 1.15rem;
  line-height: 1.2;
}

.service-text small {
  color: var(--muted);
  line-height: 1.4;
}

.service-text em {
  font-style: normal;
  color: var(--primary);
  font-weight: 900;
  font-size: 0.88rem;
}

.radio-dot {
  width: 18px;
  height: 18px;
  border: 2px solid var(--line);
  border-radius: 50%;
  margin-left: auto;
  flex: 0 0 auto;
}

.service-card.active .radio-dot {
  border-color: var(--primary);
  background: var(--primary);
  box-shadow: inset 0 0 0 4px var(--surface);
}

.inputs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  min-width: 0;
}

.field span {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 900;
  line-height: 1.3;
}

.field em {
  font-style: normal;
  color: var(--muted);
  font-weight: 700;
}

.field input,
.base-form input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 13px 12px;
  background: #fff;
  color: var(--ink);
  min-width: 0;
}

.field small {
  color: var(--muted);
  line-height: 1.4;
}

.choice-group {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}

.choice-group legend {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 900;
  margin-bottom: 10px;
}

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
}

.segmented button {
  border: 0;
  background: transparent;
  color: var(--ink);
  border-radius: 9px;
  padding: 12px 8px;
  font-weight: 900;
}

.segmented button.on {
  background: var(--primary);
  color: #fff;
}

.two-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 18px 0;
}

.quick {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
}

.quick button {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 999px;
  padding: 9px 12px;
  font-weight: 800;
}

.quick button.clear {
  background: transparent;
}

.base-panel {
  border-top: 1px solid var(--line);
  margin-top: 24px;
  padding-top: 16px;
}

.base-toggle {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--ink);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-weight: 900;
}

.base-toggle span {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rotated {
  transform: rotate(180deg);
}

.base-form {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  display: grid;
  gap: 12px;
}

.base-form label {
  display: grid;
  gap: 6px;
  font-weight: 800;
}

.base-form p {
  margin: 0;
  line-height: 1.5;
}

.base-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  font-weight: 800;
  color: var(--primary);
}

.base-preview {
  color: var(--muted);
  line-height: 1.5;
  margin: 10px 0 0;
}

.result {
  background: var(--primary);
  color: #fff;
  border-radius: 26px;
  padding: 26px;
  position: sticky;
  top: 78px;
  box-shadow: 0 22px 50px rgba(38, 86, 56, 0.24);
}

.result-head {
  display: flex;
  gap: 11px;
  align-items: center;
  margin-bottom: 28px;
}

.result-head span,
.result-head strong {
  display: block;
}

.result-head span {
  opacity: 0.8;
}

.label {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 900;
  opacity: 0.85;
  margin: 0;
}

.big-price {
  font-family: Georgia, serif;
  font-size: clamp(2.25rem, 4.2vw, 3.45rem);
  line-height: 1.02;
  margin: 10px 0;
  overflow-wrap: anywhere;
}

.big-price.range {
  font-size: clamp(1.8rem, 3.3vw, 2.55rem);
}

.big-price span {
  font-size: 1.15rem;
  font-family: system-ui, sans-serif;
}

.per-m2 {
  opacity: 0.9;
  margin: 0 0 16px;
}

.method {
  background: rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  padding: 12px 13px;
  line-height: 1.45;
  font-size: 0.92rem;
}

.formula {
  border-top: 1px solid rgba(255, 255, 255, 0.25);
  border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  padding: 15px 0;
  margin: 20px 0;
}

.formula p {
  opacity: 0.9;
  line-height: 1.55;
  margin: 8px 0 0;
}

.lists {
  display: grid;
  gap: 18px;
}

.lists h4,
.next-step h4 {
  margin: 0 0 9px;
}

.lists ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.lists li {
  line-height: 1.4;
  padding: 4px 0;
}

.next-step {
  background: #fffaf0;
  color: var(--ink);
  border-radius: 18px;
  padding: 18px;
  margin-top: 22px;
}

.next-step p {
  line-height: 1.5;
  margin: 0 0 12px;
}

.next-step textarea {
  width: 100%;
  resize: none;
  border: 1px solid var(--line);
  background: white;
  color: #25351f;
  border-radius: 11px;
  padding: 11px;
  line-height: 1.4;
}

.copy-btn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #241b08;
  padding: 15px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}

.copy-btn:active {
  transform: scale(0.98);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

.closing {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 40px;
  align-items: end;
  padding: 60px 0 30px;
  border-top: 1px solid var(--line);
}

.closing h2 {
  font-family: Georgia, serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  line-height: 1.05;
  margin: 0;
}

.closing p {
  line-height: 1.6;
  color: var(--muted);
}

footer {
  max-width: 1180px;
  margin: auto;
  padding: 26px 20px 34px;
  border-top: 2px solid var(--ink);
}

footer p {
  line-height: 1.6;
  margin: 0 0 10px;
}

.footer-meta {
  font-size: 0.86rem;
  color: var(--muted);
}

@media screen and (max-width: 820px) {
  .hero {
    grid-template-columns: 1fr;
  }

  .calc-grid {
    grid-template-columns: 1fr;
  }

  .result {
    position: static;
  }

  .section-head {
    flex-direction: column;
    align-items: start;
  }

  .closing {
    grid-template-columns: 1fr;
    gap: 18px;
  }
}

@media screen and (max-width: 560px) {
  .services {
    grid-template-columns: 1fr;
  }

  .inputs,
  .two-choices {
    grid-template-columns: 1fr;
  }

  .top-tag {
    display: none;
  }
}

.step-head{
  margin-top:8px
}

.step2{
  display:grid;
  gap:18px
}

.slider-field{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px
}

.slider-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-weight:900
}

.slider-top strong{
  font-size:1.6rem;
  color:var(--primary)
}

.slider-field input[type="range"]{
  width:100%;
  accent-color:var(--primary);
  margin:16px 0 6px;
  min-height:36px
}

.slider-scale{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:.85rem;
  font-weight:700
}

.slider-field small{
  color:var(--muted)
}

.choice-group legend{
  font-size:1.05rem
}

.choice-group small{
  display:block;
  color:var(--muted);
  margin-top:8px;
  line-height:1.4
}

.choice-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.choice-grid button{
  border:2px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:14px;
  padding:15px 10px;
  font-weight:900;
  min-height:54px
}

.choice-grid button.on,.quick button.on{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}

.choice-grid.three{
  grid-template-columns:1fr
}

.result{
  position:static
}

.result-note{
  line-height:1.55;
  opacity:.92;
  margin:16px 0 0
}

.closing{
  grid-template-columns:1fr;
  gap:16px
}

footer{
  max-width:780px
}

@media (min-width:560px){
  .choice-grid.three{
    grid-template-columns:repeat(3,1fr)
  }

  .services{
    grid-template-columns:repeat(2,1fr)
  }
}

@media (min-width:760px){
  .hero{
    grid-template-columns:1.15fr .85fr;
    align-items:end
  }
}
